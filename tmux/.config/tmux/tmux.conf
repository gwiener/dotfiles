# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"       # true color passthrough
set -g allow-passthrough on              # image.nvim / timg / sixel passthrough
set -sg escape-time 0                    # no Esc delay — essential for NeoVim
set -g focus-events on                   # NeoVim FocusGained/FocusLost
set -g history-limit 50000
set -g mouse on
set -g base-index 1                      # windows/panes number from 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Pane navigation (prefix-free) ───────────────────────────────────────────
bind -n M-h     select-pane -L
bind -n M-j     select-pane -D
bind -n M-k     select-pane -U
bind -n M-l     select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ── Pane splitting — direction = where the new pane opens (prefix-free) ─────
# Shift+Alt+letter / Shift+Alt+arrow
bind -n M-H       split-window -hb -c "#{pane_current_path}"
bind -n M-L       split-window -h  -c "#{pane_current_path}"
bind -n M-K       split-window -vb -c "#{pane_current_path}"
bind -n M-J       split-window -v  -c "#{pane_current_path}"
bind -n S-M-Left  split-window -hb -c "#{pane_current_path}"
bind -n S-M-Right split-window -h  -c "#{pane_current_path}"
bind -n S-M-Up    split-window -vb -c "#{pane_current_path}"
bind -n S-M-Down  split-window -v  -c "#{pane_current_path}"

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Pane zoom ────────────────────────────────────────────────────────────────
bind -n M-z resize-pane -Z

# ── Window navigation (prefix-free) ─────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ── Pane movement ────────────────────────────────────────────────────────────
bind -n M-! break-pane                   # pop pane into its own window
bind > swap-pane -D                      # swap with next pane
bind < swap-pane -U                      # swap with previous pane

# ── Copy mode (vim motions) ──────────────────────────────────────────────────
set -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send -X copy-line
# / and ? already work as search forward/backward in vi copy mode

# ── Copy mode / command prompt colors ───────────────────────────────────────
set -g mode-style            "bg=colour39,fg=black"    # selection highlight in copy mode
set -g message-style         "bg=colour39,fg=black"    # prefix+: command prompt
set -g message-command-style "bg=colour39,fg=black"    # command mode prompt

# ── Pane borders ─────────────────────────────────────────────────────────────
set -g pane-border-lines         heavy
set -g pane-border-indicators    both
set -g pane-border-style         "fg=colour240"   # muted gray — inactive
set -g pane-active-border-style  "fg=colour208"   # orange — vivid on light+dark

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-style          "bg=default,fg=default"
set -g status-left           ""
set -g status-right          ""
set -g status-justify        left

set -g window-style 'fg=colour245,bg=colour233'
set -g window-active-style 'fg=colour231,bg=colour16'


set -g window-status-separator      ""
set -g window-status-format         "  #I #W  "
set -g window-status-current-format "  #I #W  "
set -g window-status-style          "fg=colour240"
set -g window-status-current-style  "fg=default,bold"
